<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-card-mangatoithuong" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
    <linearGradient id="border-card-mangatoithuong" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="glow-card-mangatoithuong" cx="3%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <style>
      .t-card-mangatoithuong { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.3px; }
      .d-card-mangatoithuong { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 400; fill: #94a3b8; line-height: 1.5; }
      .b-card-mangatoithuong { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; font-weight: 700; fill: #c084fc; letter-spacing: 0.8px; }
      .h-card-mangatoithuong { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect x="1" y="1" width="878" height="188" rx="14" fill="url(#bg-card-mangatoithuong)" stroke="url(#border-card-mangatoithuong)" stroke-width="1.2" />
  <rect x="1" y="1" width="878" height="188" rx="14" fill="url(#glow-card-mangatoithuong)" />

  <!-- Left Accent Bar -->
  <rect x="1" y="24" width="3.5" height="42" rx="1.75" fill="#8b5cf6" />

  <!-- Icon Container -->
  <g transform="translate(28, 24)">
    <rect width="44" height="44" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M22 14 L32 19 L22 24 L12 19 z M12 25 L22 30 L32 25 M12 29 L22 34 L32 29" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title &amp; Badge -->
  <g transform="translate(84, 34)">
    <text x="0" y="0" class="t-card-mangatoithuong">MangaToiThuong Media Platform</text>
    <rect x="338.79999999999995" y="-15" width="193.5" height="20" rx="5" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-width="0.8" />
    <text x="435.54999999999995" y="-1.5" text-anchor="middle" class="b-card-mangatoithuong">PRODUCTION CONTENT PLATFORM</text>
  </g>

  <!-- External Link Icon -->
  <g transform="translate(832, 28)">
    <circle cx="14" cy="14" r="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M10 18 L18 10 M18 10 L13 10 M18 10 L18 15" stroke="#8b5cf6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Description Lines -->
  <g transform="translate(84, 68)">
    <text x="0" y="0" class="d-card-mangatoithuong">High-performance content delivery web platform (mangatoithuong.com) backed by an automated Python image optimization engine,</text>
    <text x="0" y="20" class="d-card-mangatoithuong">automated WebP frame validation, and headless browser automated visual regression QA.</text>
  </g>

  <!-- Key Highlights -->
  <g transform="translate(84, 118)">
    <text x="0" y="0" class="h-card-mangatoithuong">
      <tspan fill="#8b5cf6" font-weight="600">Key Highlights:</tspan> Automated WebP Asset Pipeline • Headless Chrome Visual QA • Custom Domain DNS • High-Speed Static Delivery
    </text>
  </g>

  <!-- Tech Badges -->
    <g transform="translate(32, 146)">
      <rect width="65.0" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="32.5" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">Python</text>
    </g>
    <g transform="translate(105.0, 146)">
      <rect width="177.5" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="88.75" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">Playwright / Headless</text>
    </g>
    <g transform="translate(290.5, 146)">
      <rect width="102.5" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="51.25" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">WebP Engine</text>
    </g>
    <g transform="translate(401.0, 146)">
      <rect width="57.5" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="28.75" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">HTML5</text>
    </g>
    <g transform="translate(466.5, 146)">
      <rect width="50.0" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="25.0" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">CSS3</text>
    </g>
    <g transform="translate(524.5, 146)">
      <rect width="95.0" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="47.5" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">Automation</text>
    </g>
</svg>