<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-card-iuhgpa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
    <linearGradient id="border-card-iuhgpa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="glow-card-iuhgpa" cx="3%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <style>
      .t-card-iuhgpa { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.3px; }
      .d-card-iuhgpa { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 400; fill: #94a3b8; line-height: 1.5; }
      .b-card-iuhgpa { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; font-weight: 700; fill: #fbbf24; letter-spacing: 0.8px; }
      .h-card-iuhgpa { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect x="1" y="1" width="878" height="188" rx="14" fill="url(#bg-card-iuhgpa)" stroke="url(#border-card-iuhgpa)" stroke-width="1.2" />
  <rect x="1" y="1" width="878" height="188" rx="14" fill="url(#glow-card-iuhgpa)" />

  <!-- Left Accent Bar -->
  <rect x="1" y="24" width="3.5" height="42" rx="1.75" fill="#f59e0b" />

  <!-- Icon Container -->
  <g transform="translate(28, 24)">
    <rect width="44" height="44" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M14 30 L20 22 L26 26 L32 16 M14 32 h20 M32 16 h-5 M32 16 v5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title &amp; Badge -->
  <g transform="translate(84, 34)">
    <text x="0" y="0" class="t-card-iuhgpa">IUH GPA Calculator &amp; Analytics</text>
    <rect x="350.0" y="-15" width="200.0" height="20" rx="5" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="0.8" />
    <text x="450.0" y="-1.5" text-anchor="middle" class="b-card-iuhgpa">BROWSER UTILITY • 500+ USERS</text>
  </g>

  <!-- External Link Icon -->
  <g transform="translate(832, 28)">
    <circle cx="14" cy="14" r="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M10 18 L18 10 M18 10 L13 10 M18 10 L18 15" stroke="#f59e0b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Description Lines -->
  <g transform="translate(84, 68)">
    <text x="0" y="0" class="d-card-iuhgpa">Production Chrome Extension built for Industrial University of Ho Chi Minh City students to automatically parse academic portals,</text>
    <text x="0" y="20" class="d-card-iuhgpa">compute cumulative weighted GPAs according to IUH standards, and generate downloadable Excel scorecards.</text>
  </g>

  <!-- Key Highlights -->
  <g transform="translate(84, 118)">
    <text x="0" y="0" class="h-card-iuhgpa">
      <tspan fill="#f59e0b" font-weight="600">Key Highlights:</tspan> 500+ Active Student Users • 100% Offline Client-Side Execution • Zero Data Collection • Direct XLSX Export
    </text>
  </g>

  <!-- Tech Badges -->
    <g transform="translate(32, 146)">
      <rect width="95.0" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="47.5" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">JavaScript</text>
    </g>
    <g transform="translate(135.0, 146)">
      <rect width="170.0" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="85.0" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">Chrome Extension MV3</text>
    </g>
    <g transform="translate(313.0, 146)">
      <rect width="95.0" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="47.5" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">DOM Parser</text>
    </g>
    <g transform="translate(416.0, 146)">
      <rect width="72.5" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="36.25" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">ExcelJS</text>
    </g>
    <g transform="translate(496.5, 146)">
      <rect width="57.5" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="28.75" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">HTML5</text>
    </g>
    <g transform="translate(562.0, 146)">
      <rect width="50.0" height="24" rx="6" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="0.8" />
      <text x="25.0" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94a3b8">CSS3</text>
    </g>
</svg>